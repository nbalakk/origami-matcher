<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Внутренний инструмент</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#161d26;--muted:#68737e;--line:#e3e7ed;--line2:#eef1f5;
    --accent:#2f6fed;--accent2:#e9f0ff;
    --ok:#0d7a41;--okbg:#e6f6ec;--warn:#8a5c00;--warnbg:#fdf3e0;--err:#b3261e;--errbg:#fcebea;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 90px;}
  h1{font-size:21px;margin:0 0 3px;}
  .sub{color:var(--muted);margin:0 0 18px;font-size:13.5px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);}
  .tab.on{background:var(--card);border-color:var(--line);color:var(--ink);margin-bottom:-1px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:13px;}
  .card.off{opacity:.42;pointer-events:none;}
  .step{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px;}
  .num{flex:none;width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;}
  .step .hint{font-weight:400;color:var(--muted);font-size:13px;}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:#fafbfc;font-size:14px;}
  .drop.hot{border-color:var(--accent);background:var(--accent2);color:var(--accent);}
  .drop b{color:var(--ink);}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.t th,table.t td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:middle;}
  table.t th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  table.t td.k{font-weight:600;}
  select,input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;background:#fff;width:100%;font-size:13.5px;}
  textarea{font-family:var(--mono);font-size:12px;min-height:64px;resize:vertical;}
  label.opt{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer;}
  label.opt input{margin-top:3px;flex:none;}
  label.opt .t2{font-size:12.5px;color:var(--muted);display:block;}
  .radio{border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;margin-bottom:7px;transition:.12s;}
  .radio.on{border-color:var(--accent);background:var(--accent2);}
  .radio input{margin-top:3px;flex:none;}
  .radio .t2{font-size:12.5px;color:var(--muted);}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:disabled{opacity:.42;cursor:not-allowed;}
  .btn.sec{background:#eceff4;color:var(--ink);}
  .btn.mini{padding:5px 11px;font-size:12.5px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--accent2);color:var(--accent);}
  .muted{color:var(--muted);}.small{font-size:12.5px;}
  .fitem{display:flex;justify-content:space-between;align-items:center;background:#f3f6f9;border-radius:8px;padding:6px 11px;margin-top:5px;font-size:13px;}
  .rmv{background:none;border:0;color:var(--err);cursor:pointer;font-size:12.5px;}
  .box{border-radius:8px;padding:9px 12px;margin-top:9px;font-size:13.5px;}
  .box.ok{background:var(--okbg);color:var(--ok);}.box.warn{background:var(--warnbg);color:var(--warn);}
  .box.err{background:var(--errbg);color:var(--err);}.box.info{background:#eef2f7;color:#41505f;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:7px;margin-top:6px;}
  .stat{background:#f4f7fa;border-radius:9px;padding:9px 11px;}
  .stat .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px;color:var(--muted);line-height:1.3;}
  details{margin-top:7px;}summary{cursor:pointer;color:var(--accent);font-size:12.5px;}
  .maxh{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:7px;font-family:var(--mono);font-size:11.5px;background:#fff;white-space:pre-wrap;}
  .prevwrap{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:7px;background:#fff;}
  .prevwrap table{border-collapse:collapse;font-family:var(--mono);font-size:11px;white-space:nowrap;}
  .prevwrap td,.prevwrap th{border:1px solid var(--line2);padding:3px 6px;}
  .prevwrap th{background:#f1f5fb;position:sticky;top:0;}
  .prevwrap .new{background:#e6f6ec;}.prevwrap .chg{background:#fff8e5;}
  .rule{border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;background:#fcfdfe;}
  .rule .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px;}
  .rule .rh b{font-size:14px;}
  .chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px;}
  .chk .ic{flex:none;width:17px;text-align:center;font-weight:700;}
  .chk.p .ic{color:var(--ok);}.chk.f .ic{color:var(--err);}.chk.w .ic{color:var(--warn);}
  .hide{display:none !important;}   /* сильнее любых display у классов ниже */
  hr.sep{border:0;border-top:1px solid var(--line2);margin:13px 0;}
  footer{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;
         display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);}
  footer .fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  footer .dot{opacity:.4;}
  footer b{color:var(--ink);font-weight:600;}
  footer .tag{display:inline-block;padding:2px 8px;border-radius:20px;background:#f0f3f7;font-weight:600;color:#41505f;}
  footer .st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:#f0f3f7;
             cursor:pointer;border:0;font:inherit;color:#41505f;font-weight:600;}
  footer .st:hover{background:#e6ebf2;}
  footer .st.ok{background:var(--okbg);color:var(--ok);}
  footer .st.bad{background:var(--errbg);color:var(--err);}
  footer .sup{display:inline-flex;align-items:center;gap:7px;background:var(--accent2);color:var(--accent);
              padding:5px 12px;border-radius:20px;font-weight:600;text-decoration:none;}
  footer .sup:hover{background:#dde8ff;}
  a{color:var(--accent);}
  /* выбор листов и прогресс */
  .pick{border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;background:#fcfdfe;}
  .pick .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;}
  .plist{max-height:260px;overflow:auto;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:4px;}
  .pitem{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;}
  .pitem:hover{background:#f4f7fb;}
  .pitem input{width:auto;flex:none;}
  .pitem.used{opacity:.5;cursor:default;}
  .pf{display:flex;gap:9px;align-items:center;margin-top:9px;}
  .bar{height:6px;border-radius:4px;background:#e3e9f2;margin-top:8px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .2s;}
  /* экран входа */
  #app.locked{display:none !important;}
  #gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;padding:20px;}
  #gate .g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;
           width:100%;max-width:360px;box-shadow:0 8px 30px rgba(20,30,45,.07);}
  #gate h2{margin:0 0 4px;font-size:17px;}
  #gate p{margin:0 0 16px;color:var(--muted);font-size:13px;}
  #gate .row{display:flex;gap:8px;}
  #gate input{flex:1;padding:10px 12px;font-size:15px;}
  #gate button{flex:none;padding:10px 18px;}
  #gate .er{color:var(--err);font-size:12.5px;margin-top:9px;}
  #gate .hint{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>

<div id="gate" class="hide">
  <div class="g">
    <h2>Внутренний инструмент</h2>
    <p>Доступ по паролю команды.</p>
    <div class="row">
      <input id="gatePass" type="password" placeholder="пароль" autocomplete="current-password">
      <button id="gateBtn" class="btn">Войти</button>
    </div>
    <div id="gateErr" class="er hide"></div>
    <div class="hint">Пароль запомнится в этом браузере.<br>
      Нет доступа — напишите <a href="https://t.me/nbalakk" target="_blank" rel="noopener">@nbalakk</a>.</div>
  </div>
</div>

<div class="wrap locked" id="app"></div>

  var input = document.getElementById("gatePass");
  var btn = document.getElementById("gateBtn");
  var err = document.getElementById("gateErr");

  function fail(msg) {
    err.textContent = msg;
    err.classList.remove("hide");
    btn.disabled = false;
    btn.textContent = "Войти";
    input.select();
  }

  function reveal() {
    gate.classList.add("hide");
    gate.style.display = "none";
    app.classList.remove("locked");
    app.style.display = "";
  }

  if (typeof window.__APP === "function") { reveal(); window.__APP(); return; }

  var PKG = window.__PKG;
  if (!PKG) { fail("Файл повреждён."); return; }

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function keyFromPassword(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(PKG.s), iterations: PKG.n, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  async function run(key) {
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(PKG.i) }, key, bytes(PKG.c));
    var code = new TextDecoder().decode(plain);
    reveal();
    (0, eval)(code);
  }

  async function remember(key) {
    try {
      var raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(KEY_STORE, btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
    } catch (e) {}
  }

  (async function () {
    var saved = null;
    try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
    if (saved) {
      try {
        var key = await crypto.subtle.importKey("raw", bytes(saved), { name: "AES-GCM" }, true, ["decrypt"]);
        await run(key);
        return;
      } catch (e) {
        try { localStorage.removeItem(KEY_STORE); } catch (e2) {}
      }
    }
    gate.classList.remove("hide");
    setTimeout(function () { input.focus(); }, 60);
  })();

  async function submit() {
    var value = (input.value || "").trim();
    if (!value) { input.focus(); return; }
    if (!(window.crypto && window.crypto.subtle)) {
      fail("Браузер не поддерживает расшифровку. Откройте страницу по https:// или обновите браузер.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Проверяю…";
    err.classList.add("hide");
    try {
      var key = await keyFromPassword(value);
      await run(key);
      remember(key);
    } catch (e) {
      fail("Неверный пароль");
    }
  }

  btn.addEventListener("click", submit);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  input.addEventListener("input", function () { err.classList.add("hide"); });
})();
</script>
</body>
