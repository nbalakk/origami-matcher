<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Внутренний инструмент</title>
<style>
  :root{
    --bg:#f4f6f9;--card:#fff;--ink:#161d26;--muted:#68737e;--line:#e3e7ed;--line2:#eef1f5;
    --accent:#2f6fed;--accent2:#e9f0ff;
    --ok:#0d7a41;--okbg:#e6f6ec;--warn:#8a5c00;--warnbg:#fdf3e0;--err:#b3261e;--errbg:#fcebea;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 90px;}
  h1{font-size:21px;margin:0 0 3px;}
  .sub{color:var(--muted);margin:0 0 18px;font-size:13.5px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);}
  .tab.on{background:var(--card);border-color:var(--line);color:var(--ink);margin-bottom:-1px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:13px;}
  .card.off{opacity:.42;pointer-events:none;}
  .step{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px;}
  .num{flex:none;width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;}
  .step .hint{font-weight:400;color:var(--muted);font-size:13px;}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:#fafbfc;font-size:14px;}
  .drop.hot{border-color:var(--accent);background:var(--accent2);color:var(--accent);}
  .drop b{color:var(--ink);}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.t th,table.t td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:middle;}
  table.t th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  table.t td.k{font-weight:600;}
  select,input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;background:#fff;width:100%;font-size:13.5px;}
  textarea{font-family:var(--mono);font-size:12px;min-height:64px;resize:vertical;}
  label.opt{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer;}
  label.opt input{margin-top:3px;flex:none;}
  label.opt .t2{font-size:12.5px;color:var(--muted);display:block;}
  .radio{border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;margin-bottom:7px;transition:.12s;}
  .radio.on{border-color:var(--accent);background:var(--accent2);}
  .radio input{margin-top:3px;flex:none;}
  .radio .t2{font-size:12.5px;color:var(--muted);}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:disabled{opacity:.42;cursor:not-allowed;}
  .btn.sec{background:#eceff4;color:var(--ink);}
  .btn.mini{padding:5px 11px;font-size:12.5px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--accent2);color:var(--accent);}
  .muted{color:var(--muted);}.small{font-size:12.5px;}
  .fitem{display:flex;justify-content:space-between;align-items:center;background:#f3f6f9;border-radius:8px;padding:6px 11px;margin-top:5px;font-size:13px;}
  .rmv{background:none;border:0;color:var(--err);cursor:pointer;font-size:12.5px;}
  .box{border-radius:8px;padding:9px 12px;margin-top:9px;font-size:13.5px;}
  .box.ok{background:var(--okbg);color:var(--ok);}.box.warn{background:var(--warnbg);color:var(--warn);}
  .box.err{background:var(--errbg);color:var(--err);}.box.info{background:#eef2f7;color:#41505f;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:7px;margin-top:6px;}
  .stat{background:#f4f7fa;border-radius:9px;padding:9px 11px;}
  .stat .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px;color:var(--muted);line-height:1.3;}
  details{margin-top:7px;}summary{cursor:pointer;color:var(--accent);font-size:12.5px;}
  .maxh{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:7px;font-family:var(--mono);font-size:11.5px;background:#fff;white-space:pre-wrap;}
  .prevwrap{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:7px;background:#fff;}
  .prevwrap table{border-collapse:collapse;font-family:var(--mono);font-size:11px;white-space:nowrap;}
  .prevwrap td,.prevwrap th{border:1px solid var(--line2);padding:3px 6px;}
  .prevwrap th{background:#f1f5fb;position:sticky;top:0;}
  .prevwrap .new{background:#e6f6ec;}.prevwrap .chg{background:#fff8e5;}
  .rule{border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;background:#fcfdfe;}
  .rule .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px;}
  .rule .rh b{font-size:14px;}
  .chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px;}
  .chk .ic{flex:none;width:17px;text-align:center;font-weight:700;}
  .chk.p .ic{color:var(--ok);}.chk.f .ic{color:var(--err);}.chk.w .ic{color:var(--warn);}
  .hide{display:none !important;}   /* сильнее любых display у классов ниже */
  hr.sep{border:0;border-top:1px solid var(--line2);margin:13px 0;}
  footer{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;
         display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);}
  footer .fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  footer .dot{opacity:.4;}
  footer b{color:var(--ink);font-weight:600;}
  footer .tag{display:inline-block;padding:2px 8px;border-radius:20px;background:#f0f3f7;font-weight:600;color:#41505f;}
  footer .st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:#f0f3f7;
             cursor:pointer;border:0;font:inherit;color:#41505f;font-weight:600;}
  footer .st:hover{background:#e6ebf2;}
  footer .st.ok{background:var(--okbg);color:var(--ok);}
  footer .st.bad{background:var(--errbg);color:var(--err);}
  footer .sup{display:inline-flex;align-items:center;gap:7px;background:var(--accent2);color:var(--accent);
              padding:5px 12px;border-radius:20px;font-weight:600;text-decoration:none;}
  footer .sup:hover{background:#dde8ff;}
  a{color:var(--accent);}
  /* выбор листов и прогресс */
  .pick{border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;background:#fcfdfe;}
  .pick .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;}
  .plist{max-height:260px;overflow:auto;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:4px;}
  .pitem{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;}
  .pitem:hover{background:#f4f7fb;}
  .pitem input{width:auto;flex:none;}
  .pitem.used{opacity:.5;cursor:default;}
  .pf{display:flex;gap:9px;align-items:center;margin-top:9px;}
  .bar{height:6px;border-radius:4px;background:#e3e9f2;margin-top:8px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .2s;}
  /* экран входа */
  #app.locked{display:none !important;}
  #gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;padding:20px;}
  #gate .g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;
           width:100%;max-width:360px;box-shadow:0 8px 30px rgba(20,30,45,.07);}
  #gate h2{margin:0 0 4px;font-size:17px;}
  #gate p{margin:0 0 16px;color:var(--muted);font-size:13px;}
  #gate .row{display:flex;gap:8px;}
  #gate input{flex:1;padding:10px 12px;font-size:15px;}
  #gate button{flex:none;padding:10px 18px;}
  #gate .er{color:var(--err);font-size:12.5px;margin-top:9px;}
  #gate .hint{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>

<div id="gate" class="hide">
  <div class="g">
    <h2>Внутренний инструмент</h2>
    <p>Доступ по паролю команды.</p>
    <div class="row">
      <input id="gatePass" type="password" placeholder="пароль" autocomplete="current-password">
      <button id="gateBtn" class="btn">Войти</button>
    </div>
    <div id="gateErr" class="er hide"></div>
    <div class="hint">Пароль запомнится в этом браузере.<br>
      Нет доступа — напишите <a href="https://t.me/nbalakk" target="_blank" rel="noopener">@nbalakk</a>.</div>
  </div>
</div>

<div class="wrap locked" id="app"></div>

<script>
/* ---------- src/core/fmt.js ---------- */
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 1 · Fmt — формат CSV и чисел
   ══════════════════════════════════════════════════════════════════════════ */
var Fmt=(function(){
  function parseLine(line){
    var out=[],cur="",q=false;
    for(var i=0;i<line.length;i++){var c=line[i];
      if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
      else { if(c==='"')q=true; else if(c===';'){out.push(cur);cur="";} else cur+=c; }
    } out.push(cur); return out;
  }
  function field(v){ v=String(v==null?"":v); return /[\s;",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  function idField(v){ return field('="'+v+'"'); }
  /* Excel хранит большие числа как "6.022736E7". Разворачиваем строкой, без
     float — иначе ID кампании превращается в мусор. */
  function plain(s){
    s=String(s==null?"":s).trim();
    var m=/^([+-]?)(\d*)(?:\.(\d*))?[eE]([+-]?\d+)$/.exec(s);
    if(!m)return s;
    var sign=m[1]==="-"?"-":"",ds=(m[2]||"")+(m[3]||""),pt=(m[2]||"").length+parseInt(m[4],10),out;
    if(pt<=0)out="0."+new Array(1-pt).join("0")+ds;
    else if(pt>=ds.length)out=ds+new Array(pt-ds.length+1).join("0");
    else out=ds.slice(0,pt)+"."+ds.slice(pt);
    if(out.indexOf(".")>=0)out=out.replace(/0+$/,"").replace(/\.$/,"");
    out=out.replace(/^0+(?=\d)/,"");
    return sign+out;
  }
  function digits(s){ var m=plain(s).match(/\d+/g); return m?m.join(""):""; }
  function num(s){
    if(s===null||s===undefined)return null;
    if(typeof s==="number")return isFinite(s)?s:null;
    s=String(s).replace(/ /g,"").replace(/\s/g,"").replace(",",".");
    if(s===""||s==="#REF!"||s==="-"||s==="#ДЕЛ/0!")return null;
    var v=parseFloat(s); return isFinite(v)?v:null;
  }
  function roundHalfUp(x){ return x<0?-Math.round(-x):Math.round(x); }
  function out(x,round){
    if(round)return String(roundHalfUp(x));
    if(Number.isInteger(x))return String(x);
    return (Math.round(x*100)/100).toFixed(2).replace(/0+$/,"").replace(/\.$/,"").replace(".",",");
  }
  function splitVal(line){ var i=line.lastIndexOf(";"); return {prefix:line.slice(0,i),value:line.slice(i+1)}; }
  return {parseLine:parseLine,field:field,idField:idField,digits:digits,plain:plain,num:num,
          roundHalfUp:roundHalfUp,out:out,splitVal:splitVal};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Fmt;

/* ---------- src/core/export.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 3 · Exp — разбор заливочного (истина о том, что можно менять)
   ══════════════════════════════════════════════════════════════════════════ */
var Exp=(function(){
  function parse(text){
    var bom=text.charCodeAt(0)===0xFEFF; if(bom)text=text.slice(1);
    var eol=text.indexOf("\r\n")>=0?"\r\n":"\n";
    var lines=text.split(eol),head=Fmt.parseLine(lines[0]);
    var C={acc:head.indexOf("AccountID"),accName:head.indexOf("AccountName"),camp:head.indexOf("CampaignID"),
      campName:head.indexOf("CampaignName"),place:head.indexOf("Размещение"),strat:head.indexOf("Название стратегии"),
      goal:head.indexOf("GoalID"),goalName:head.indexOf("Цели автостратегии"),val:head.length-1};
    var mode=C.goal>=0?"bids":"budget";
    var rows=[],goals=[],gSeen={},accounts={},places={},strats={},camps={},pairs={};
    for(var i=1;i<lines.length;i++){
      if(lines[i]==="")continue;
      var f=Fmt.parseLine(lines[i]);
      var cid=Fmt.digits(f[C.camp]||""),gid=C.goal>=0?Fmt.digits(f[C.goal]||""):"";
      rows.push({line:lines[i],cid:cid,gid:gid,f:f});
      camps[cid]=(camps[cid]||0)+1; pairs[cid+"|"+gid]=1;
      if(gid&&!gSeen[gid]){gSeen[gid]=1;goals.push({id:gid,label:(C.goalName>=0?f[C.goalName]:"")||("Цель "+gid)});}
      var an=f[C.accName]; if(an&&!accounts[an])accounts[an]=Fmt.digits(f[C.acc]||"");
      var p=f[C.place]; if(p)places[p]=(places[p]||0)+1;
      var s=f[C.strat]; if(s)strats[s]=(strats[s]||0)+1;
    }
    var search=null,net=null;
    Object.keys(places).forEach(function(p){ if(/поиск/i.test(p))search=p; if(/сет/i.test(p))net=p; });
    // если одного из вариантов в файле нет — берём регистр по имеющемуся
    var lower=function(s){ return s&&s[0]===s[0].toLowerCase(); };
    if(!net)  net  = lower(search)? "сети"  : "Сеть";
    if(!search)search= lower(net)  ? "поиск" : "Поиск";
    var stratList=Object.keys(strats).sort(function(a,b){return strats[b]-strats[a];});
    return {ok:C.camp>=0,bom:bom,eol:eol,header:lines[0],cols:head.length,C:C,mode:mode,rows:rows,goals:goals,
      campaigns:camps,pairs:pairs,accounts:accounts,place:{search:search,net:net},
      strategies:stratList,strategyTop:stratList[0]||""};
  }
  // индекс значений: campaign|goal -> value (для режима сверки)
  function valueIndex(e){
    var m={};
    e.rows.forEach(function(r){ m[r.cid+"|"+r.gid]=Fmt.splitVal(r.line).value; });
    return m;
  }
  return {parse:parse,valueIndex:valueIndex};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Exp;

/* ---------- src/core/accounts.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 2b · Accounts — справочник «логин → AccountID»

   Нужен ровно для одного случая: собрать строку бюджета кампании, которой
   нет в заливочном. Номер аккаунта не выводится из названия и не угадывается
   по похожести — он либо есть в заливочном, либо в справочнике, либо его
   вписывают руками. Иначе Оригами отобьёт файл.

   Справочник ниже — то, что уже встречалось в выгрузках. Он не заменяет
   заливочный, а только подставляет значение в поле: видно, откуда оно взято,
   и его всегда можно перебить.
   ══════════════════════════════════════════════════════════════════════════ */
var Accounts=(function(){
  var BOOK={
    "pro-vseinstrumenti":"336570",
    "pro-vseinstrumenti-ank":"336596",
    "pro-vseinstrumenti-auto":"336576",
    "pro-vseinstrumenti-auto-2":"336587",
    "pro-vseinstrumenti-auto-rsya":"336577",
    "pro-vseinstrumenti-b2b":"336594",
    "pro-vseinstrumenti-b2c":"336595",
    "pro-vseinstrumenti-centr":"336571",
    "pro-vseinstrumenti-dsa":"336585",
    "pro-vseinstrumenti-media":"336591",
    "pro-vseinstrumenti-postavshik2":"336582",
    "pro-vseinstrumenti-postavshik3":"336583",
    "pro-vseinstrumenti-postavshiki":"336578",
    "pro-vseinstrumenti-rivals":"336589",
    "pro-vseinstrumenti-rsya2":"336581",
    "pro-vseinstrumenti-sz":"336575",
    "pro-vseinstrumenti-yug":"336572"
  };

  function norm(s){ return String(s==null?"":s).trim().toLowerCase(); }

  /* Ищем номер аккаунта. Порядок важен: заливочный — источник правды,
     всё остальное лишь подсказка. learned — пары, выученные из ранее
     загруженных заливочных (их подкладывает интерфейс). */
  function find(login,exp,learned){
    var lg=norm(login);
    if(!lg)return null;
    var byExp=exp&&exp.accounts?exp.accounts[String(login).trim()]:null;
    if(byExp)return {id:byExp,src:"exp",note:"из заливочного"};
    if(learned&&learned[lg])return {id:learned[lg],src:"learned",note:"из прошлых заливочных"};
    if(BOOK[lg])return {id:BOOK[lg],src:"book",note:"из справочника"};
    return null;
  }

  /* Пары «логин → AccountID» из заливочного — чтобы запомнить их на будущее. */
  function harvest(exp){
    var out={};
    if(exp&&exp.accounts)for(var k in exp.accounts){
      var id=exp.accounts[k],lg=norm(k);
      if(lg&&id)out[lg]=id;
    }
    return out;
  }

  function merge(a,b){
    var out={},k;
    for(k in (a||{}))out[k]=a[k];
    for(k in (b||{}))out[k]=b[k];
    return out;
  }

  function list(){
    return Object.keys(BOOK).sort().map(function(k){return {login:k,id:BOOK[k]};});
  }

  return {find:find,harvest:harvest,merge:merge,list:list,size:Object.keys(BOOK).length};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Accounts;

/* ---------- src/core/sheet.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 4 · Sheet — разметка листа мастер-отчёта
   ══════════════════════════════════════════════════════════════════════════ */
var Sheet=(function(){
  var KW={"357428649":["b2b","б2б"],"357428736":["b2c","б2с"],
          "3000601598":["ecom","еком","cpa","покуп"],
          "1900001695":["андроид","aos","android"],"1900018239":["айос","ios"],
          "354427177":["первый"]};
  function parseCsvGrid(raw){
    raw=raw.replace(/^﻿/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").replace(/\n+$/,"");
    if(raw==="")return [];
    var lines=raw.split("\n");
    var d=lines[0].indexOf("\t")>=0?"\t":(lines[0].indexOf(";")>=0?";":",");
    return lines.map(function(l){ return d===";"?Fmt.parseLine(l):l.split(d); });
  }
  function colByName(h,re){ for(var i=0;i<h.length;i++) if(re.test(String(h[i]||""))) return i; return -1; }
  function findHeaderRow(rows){
    for(var i=0;i<Math.min(rows.length,25);i++){
      var r=rows[i]||[];
      for(var j=0;j<r.length;j++){
        var s=String(r[j]||"").trim().toLowerCase();
        if(s==="id кампании"||s==="id"||s==="campaignid"||s==="id кампаний")return i;
      }
    } return 0;
  }
  function findIdCol(rows,hr){
    var h=rows[hr]||[],byName=colByName(h,/^\s*(id кампании|id|campaignid)\s*$/i);
    if(byName>=0)return byName;
    var cols=0; rows.forEach(function(r){if(r.length>cols)cols=r.length;});
    var best=0,bs=-1;
    for(var c=0;c<cols;c++){var sc=0;
      for(var r=hr+1;r<Math.min(rows.length,hr+50);r++) if(rows[r]&&Fmt.digits(rows[r][c]||"").length>=7)sc++;
      if(sc>bs){bs=sc;best=c;}}
    return best;
  }
  function describe(file,name,rows){
    var hr=findHeaderRow(rows),h=rows[hr]||[];
    return {file:file,name:name,rows:rows,headerRow:hr,idCol:findIdCol(rows,hr),
      loginCol:colByName(h,/логин|аккаунт/i),nameCol:colByName(h,/название/i),stratCol:colByName(h,/стратег/i)};
  }
  /* приоритет: «НОВАЯ»/«Итоговая» ≫ «тек.»/«по чеку»/«Ветка»/«кэф»/«Δ» */
  function parseIdList(raw){
    var seen={},out=[];
    (String(raw||"").match(/\d{5,}/g)||[]).forEach(function(id){ if(!seen[id]){seen[id]=1;out.push(id);} });
    return out;
  }
  return {parseCsvGrid:parseCsvGrid,describe:describe,findHeaderRow:findHeaderRow,findIdCol:findIdCol,
          colByName:colByName,parseIdList:parseIdList};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Sheet;

/* ---------- src/core/rules.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 5 · Rules — правила → карта значений (с источником и конфликтами)
   ══════════════════════════════════════════════════════════════════════════ */
var Rules=(function(){
  /* rule = {name, sheet:idx, scopeIds:[], useScope:bool, map:{goalId|BUDGET:col}} */
  function resolve(exp,sources,rules,opts){
    var lut={},src={},meta={},conflicts=[],skippedZero=0,zeros=[],scopeAll={};
    rules.forEach(function(rule,ri){
      var sh=sources[rule.sheet]; if(!sh)return;
      /* считаем заново на каждый вызов: resolve дёргается и при отрисовке,
         иначе список «нет на листе» копится от прогона к прогону */
      rule.notOnSheet=null;
      var seenIds={},scope=null;
      if(rule.useScope&&rule.scopeIds.length){ scope={}; rule.scopeIds.forEach(function(i){scope[i]=1;}); }
      for(var i=sh.headerRow+1;i<sh.rows.length;i++){
        var row=sh.rows[i]; if(!row)continue;
        var cid=Fmt.digits(row[sh.idCol]||""); if(!cid)continue;
        if(scope&&!scope[cid])continue;
        seenIds[cid]=1; scopeAll[cid]=1;
        if(!meta[cid])meta[cid]={
          name:sh.nameCol>=0?String(row[sh.nameCol]||""):"",
          login:sh.loginCol>=0?String(row[sh.loginCol]||"").trim():"",
          strat:sh.stratCol>=0?String(row[sh.stratCol]||"").trim():"",
          rule:rule.name};
        Object.keys(rule.map).forEach(function(key){
          var col=rule.map[key]; if(col===undefined||col<0)return;
          var raw=Fmt.num(row[col]); if(raw===null||raw<=0)return;
          var val=opts.roundNew?Fmt.roundHalfUp(raw):raw;
          if(val<=0){skippedZero++;zeros.push({cid:cid,key:key,raw:raw});return;}
          var k=cid+"|"+key,prev=lut[k];
          if(prev!==undefined&&prev!==val)
            conflicts.push({cid:cid,key:key,a:prev,aRule:src[k],b:val,bRule:rule.name});
          lut[k]=val; src[k]=rule.name;
        });
      }
      // ID из списка, которых нет на листе
      if(scope){
        rule.scopeIds.forEach(function(id){ if(!seenIds[id]) (rule.notOnSheet=rule.notOnSheet||[]).push(id); });
      }
    });
    return {lut:lut,src:src,meta:meta,conflicts:conflicts,skippedZero:skippedZero,zeros:zeros,
            campaigns:Object.keys(scopeAll)};
  }
  return {resolve:resolve};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Rules;

/* ---------- src/core/build.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 6 · Build — сборка файла
   ══════════════════════════════════════════════════════════════════════════ */
var Build=(function(){
  function run(plan){
    var exp=plan.exp,R=Rules.resolve(exp,plan.sources,plan.rules,plan),lut=R.lut;
    var issues=[],preview=[],manual=[],out=[exp.header];
    var glabel=function(g){ return (exp.goals.filter(function(x){return x.id===g;})[0]||{}).label||g; };
    var mrow=function(cid,target,value,reason){ var m=R.meta[cid]||{};
      manual.push({cid:cid,login:m.login||'',name:m.name||'',target:target,value:value,reason:reason}); };
    var scope=null;
    if(plan.scenario==="new"){ scope={}; R.campaigns.forEach(function(c){scope[c]=1;}); }
    var inScope=function(c){ return !scope||scope[c]===1; };
    var applied={},pairsDone={},nIns=0,nChg=0,nRnd=0,nKeep=0;

    exp.rows.forEach(function(r){
      if(!inScope(r.cid))return;
      var key=r.cid+"|"+(exp.mode==="bids"?r.gid:"BUDGET");
      var nv=lut[key];
      var sv=Fmt.splitVal(r.line);
      if(nv!==undefined){
        var s=Fmt.out(nv,plan.roundNew);
        out.push(sv.prefix+";"+s); nIns++; applied[r.cid]=1; pairsDone[key]=1;
        if(s!==sv.value){ nChg++; if(preview.length<80)preview.push({cid:r.cid,name:r.f[exp.C.campName],
          goal:exp.C.goalName>=0?r.f[exp.C.goalName]:"бюджет",was:sv.value,now:s,kind:"chg"}); }
      }else{
        if(plan.onlyChanged)return;   /* работает в обоих сценариях */
        var keep=sv.value;
        if(plan.roundAll){ var ov=Fmt.num(sv.value); if(ov!==null){ var rs=String(Fmt.roundHalfUp(ov)); if(rs!==sv.value)nRnd++; keep=rs; } }
        out.push(sv.prefix+";"+keep); nKeep++;
      }
    });

    /* ---- кампании, которых нет в заливочном ----------------------------
       Строка собирается ТОЛЬКО из настоящей выгрузки: основной либо любой
       другой, загруженной как запасная. Ни аккаунт, ни размещение, ни
       стратегия не выводятся из названия — Оригами сверяет каждую строку
       с фактической автостратегией и отбивает файл целиком при расхождении.
       Чего нет ни в одной выгрузке — уходит в список на ручную работу. */
    var missing=R.campaigns.filter(function(c){ return !exp.campaigns[c] && Object.keys(lut).some(function(k){return k.indexOf(c+"|")===0;}); });
    var constructed=0,blocked=[],fromSpare=[];
    function spareRow(cid,gid){
      var list=plan.spares||[];
      for(var i=0;i<list.length;i++){
        var sp=list[i]; if(!sp||sp.mode!==exp.mode)continue;
        var hit=null;
        sp.rows.forEach(function(r){
          if(hit)return;
          if(r.cid!==cid)return;
          if(exp.mode==="bids"&&String(r.gid)!==String(gid))return;
          hit=r;
        });
        if(hit)return {row:hit,name:sp.name||("выгрузка "+(i+1))};
      }
      return null;
    }
    if(missing.length){
      missing.forEach(function(cid){
        var keys=Object.keys(lut).filter(function(k){return k.indexOf(cid+"|")===0;});
        var got=0;
        if(plan.addMissing){
          keys.forEach(function(k){
            var gid=k.split("|")[1];
            var sp=spareRow(cid,exp.mode==="bids"?gid:null);
            if(!sp)return;
            var sv=Fmt.splitVal(sp.row.line);
            out.push(sv.prefix+";"+Fmt.out(lut[k],plan.roundNew));
            constructed++; got++; applied[cid]=1; pairsDone[k]=1;
            if(fromSpare.indexOf(sp.name)<0)fromSpare.push(sp.name);
            if(preview.length<80)preview.push({cid:cid,name:(R.meta[cid]||{}).name||"",
              goal:exp.mode==="bids"?glabel(gid):"бюджет",was:"—",now:Fmt.out(lut[k],plan.roundNew),kind:"new"});
          });
        }
        if(got===keys.length)return;
        blocked.push(cid+"  "+((R.meta[cid]||{}).login||"")+"  "+((R.meta[cid]||{}).name||""));
        keys.forEach(function(k){
          if(pairsDone[k])return;
          mrow(cid,exp.mode==="bids"?glabel(k.split("|")[1]):"бюджет",lut[k],
               plan.addMissing?"нет ни в одной загруженной выгрузке":"кампании нет в заливочном");
        });
      });
      if(constructed)issues.push({lvl:"warn",title:"Строки взяты из запасной выгрузки: "+constructed,
        note:"Аккаунт, размещение и стратегия у них настоящие — из "+fromSpare.join(", ")+
             ". Но эта выгрузка может быть старше основной: если у кампании с тех пор сменили автостратегию, Оригами отобьёт весь файл. Надёжнее перевыгрузить заливочный так, чтобы эти кампании попали в него сами.",items:[]});
      if(blocked.length){
        var acc={};
        missing.forEach(function(c){ var lg=(R.meta[c]||{}).login||""; if(lg)acc[lg]=1; });
        var hint=Object.keys(acc).map(function(lg){
          var f=typeof Accounts!=="undefined"?Accounts.find(lg,exp,plan.accountBook):null;
          return lg+(f?" ("+f.id+")":"");}).join(", ");
        issues.push({lvl:"err",title:"Нет в заливочном: "+blocked.length+" РК — значения НЕ попадут в файл",
          note:(exp.mode==="bids"
            ? "Строки целей таким кампаниям не создаются: какие цели подключены — из мастер-файла не известно, а Оригами отбивает весь файл при несовпадении с автостратегией. "
            : "Строка не собирается: аккаунт, размещение и стратегия кампании из мастер-файла не известны, а угаданные Оригами отобьёт. ")+
            "Нужна перевыгрузка"+(hint?" по аккаунтам: "+hint:"")+" — либо загрузи запасную выгрузку, где эти кампании есть.",
          items:blocked});
      }
    }

    /* ---- значение есть, а строки-цели у существующей РК нет ---- */
    if(exp.mode==="bids"){
      var noRow=[];
      Object.keys(lut).forEach(function(k){
        var p=k.split("|"),cid=p[0],gid=p[1];
        if(!exp.campaigns[cid]||!inScope(cid)||pairsDone[k])return;
        var lb=(exp.goals.filter(function(x){return x.id===gid;})[0]||{}).label||gid;
        noRow.push(cid+"  ·  "+lb+" = "+lut[k]);
        mrow(cid,lb,lut[k],"у кампании нет такой цели в заливочном");
      });
      if(noRow.length)issues.push({lvl:"warn",title:"У кампании нет такой цели в заливочном: "+noRow.length+" значений",
        note:"Строки для этих целей в заливочном отсутствуют — ставку положить некуда. Так бывает, когда цель не подключена к автостратегии кампании.",items:noRow});
    }
    /* ---- конфликты правил ---- */
    if(R.conflicts.length)issues.push({lvl:"err",title:"Конфликт правил: "+R.conflicts.length,
      note:"Одна и та же кампания и цель получают разные значения из разных правил. Победило последнее — проверь охват правил.",
      items:R.conflicts.map(function(c){return c.cid+" · цель "+c.key+": «"+c.aRule+"» дал "+c.a+", «"+c.bRule+"» дал "+c.b;})});
    /* ---- ID из списков, которых нет на листе ---- */
    plan.rules.forEach(function(r){
      if(r.notOnSheet&&r.notOnSheet.length)issues.push({lvl:"warn",title:"Правило «"+r.name+"»: ID нет на листе — "+r.notOnSheet.length,
        note:"Эти ID есть в твоём списке, но их нет в выбранном листе мастер-файла.",items:r.notOnSheet});
      r.notOnSheet=null;
    });
    /* ---- ничего не собралось: чаще всего перепутаны файлы ---- */
    if(out.length-1===0){
      var inExp=R.campaigns.filter(function(c){return exp.campaigns[c];}).length;
      issues.push({lvl:"err",title:"В файл не попало ни одной строки",
        note: exp.blank
          ? ("Кампаний в правилах: "+R.campaigns.length+". Ни одной строки собрать не удалось — "+
             "проверь выбранный столбец со значениями и заполни AccountID для аккаунтов из списка выше.")
          : "Кампаний в правилах: "+R.campaigns.length+", из них есть в заливочном: "+inExp+"."+
             (inExp===0
               ? " Совпадений нет вообще — почти наверняка загружены несовместимые файлы: другой заливочный (другая дата или аккаунты), не тот лист, либо неверно определён столбец ID (проверь «Настройки листов»)."
               : (plan.onlyChanged
                   ? " Совпадения есть, но ни у одной кампании нет нового значения — выключи «Только строки с новым значением» или проверь выбранный столбец."
                   : " Проверь выбранный столбец со значениями.")),items:[]});
    }
    (R.zeros||[]).forEach(function(z){ if(inScope(z.cid))
      mrow(z.cid,z.key==="BUDGET"?"бюджет":glabel(z.key),z.raw,"округляется в 0 — целым не поставить"); });
    if(R.skippedZero)issues.push({lvl:"info",title:"Пропущено значений, округляющихся в 0: "+R.skippedZero,
      note:"Например 0,38 → 0. Такие значения не проставляются — строка остаётся с прежним.",items:[]});

    var text="﻿"+out.join(exp.eol)+exp.eol;
    var campSet={}; out.slice(1).forEach(function(l){ campSet[Fmt.digits(Fmt.parseLine(l)[exp.C.camp]||"")]=1; });
    return {text:text,issues:issues,preview:preview,manual:manual,lut:lut,meta:R.meta,
      stats:{rowsIn:exp.rows.length,rowsOut:out.length-1,campaigns:Object.keys(campSet).length,
        inserted:nIns,changed:nChg,kept:nKeep,rounded:nRnd,constructed:constructed,
        sourceCampaigns:R.campaigns.length,missing:missing.length}};
  }
  return {run:run};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Build;

/* ---------- src/core/audit.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 7 · Audit — независимая пред-полётная проверка готового файла
   ══════════════════════════════════════════════════════════════════════════ */
var Audit=(function(){
  function check(text,exp,lut,plan){
    var res=[],bom=text.charCodeAt(0)===0xFEFF;
    var body=bom?text.slice(1):text;
    var eol=body.indexOf("\r\n")>=0?"\r\n":"\n";
    var lines=body.split(eol).filter(function(l){return l!=="";});
    function add(ok,lvl,title,detail){ res.push({ok:ok,lvl:ok?"p":(lvl||"f"),title:title,detail:detail||""}); }

    add(bom,"f","BOM на месте","Оригами требует UTF-8 с BOM");
    add(exp.eol==="\r\n"?text.slice(-2)==="\r\n":true,"f","Файл заканчивается переводом строки");
    add(lines[0]===exp.header,"f","Заголовок не изменён");

    var origPrefix={},origPairs=exp.pairs;
    exp.rows.forEach(function(r){ origPrefix[Fmt.splitVal(r.line).prefix]=1; });

    var invented=[],badCols=[],nonInt=[],zeros=[],dup={},dups=[],mismatch=[],outOfScope=[];
    for(var i=1;i<lines.length;i++){
      var l=lines[i],f=Fmt.parseLine(l),sv=Fmt.splitVal(l);
      var cid=Fmt.digits(f[exp.C.camp]||""),gid=exp.C.goal>=0?Fmt.digits(f[exp.C.goal]||""):"";
      if(f.length!==exp.cols)badCols.push("стр "+(i+1)+": полей "+f.length+" вместо "+exp.cols);
      var k=cid+"|"+gid;
      if(dup[k])dups.push("стр "+(i+1)+": "+cid+(gid?(" · цель "+gid):"")); dup[k]=1;
      if(plan.roundNew&&!/^-?\d+$/.test(sv.value))nonInt.push("стр "+(i+1)+": "+sv.value);
      if(sv.value==="0")zeros.push("стр "+(i+1)+": "+cid);
      var isOrig=!!origPrefix[sv.prefix];
      if(!isOrig){
        if(exp.mode==="bids")invented.push("стр "+(i+1)+": "+cid+" · цель "+gid+" — такой строки нет в заливочном");
        else if(!plan.addMissing)invented.push("стр "+(i+1)+": "+cid+" — строки нет в заливочном");
      }
      var want=lut[cid+"|"+(exp.mode==="bids"?gid:"BUDGET")];
      if(want!==undefined&&sv.value!==Fmt.out(want,plan.roundNew))
        mismatch.push("стр "+(i+1)+": "+cid+" = "+sv.value+", ожидалось "+Fmt.out(want,plan.roundNew));
    }
    add(invented.length===0,"f","Нет выдуманных строк"+(invented.length?": "+invented.length:""),invented.slice(0,15).join("\n"));
    add(badCols.length===0,"f","Во всех строках правильное число колонок",badCols.slice(0,10).join("\n"));
    add(dups.length===0,"f","Нет дублей"+(exp.mode==="bids"?" «кампания + цель»":" кампаний"),dups.slice(0,10).join("\n"));
    add(mismatch.length===0,"f","Все значения совпадают с мастер-файлом",mismatch.slice(0,15).join("\n"));
    if(plan.roundNew)add(nonInt.length===0,"f","Все значения целые",nonInt.slice(0,10).join("\n"));
    add(zeros.length===0,"w","Нет значений «0»",zeros.slice(0,10).join("\n"));
    add(lines.length-1>0,"f","В файле есть строки ("+(lines.length-1)+")");
    return res;
  }
  return {check:check};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Audit;

/* ---------- src/core/verify.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 8 · Verify — сверка: что реально встало после заливки
   ══════════════════════════════════════════════════════════════════════════ */
var Verify=(function(){
  function compare(freshExp,uploadedText){
    var live=Exp.valueIndex(freshExp);
    var bom=uploadedText.charCodeAt(0)===0xFEFF,body=bom?uploadedText.slice(1):uploadedText;
    var eol=body.indexOf("\r\n")>=0?"\r\n":"\n";
    var lines=body.split(eol).filter(function(l){return l!=="";});
    var head=Fmt.parseLine(lines[0]);
    var C={camp:head.indexOf("CampaignID"),goal:head.indexOf("GoalID"),campName:head.indexOf("CampaignName"),
           goalName:head.indexOf("Цели автостратегии"),acc:head.indexOf("AccountID")};
    var okRows=[],bad=[],absent=[],byAcc={};
    for(var i=1;i<lines.length;i++){
      var f=Fmt.parseLine(lines[i]),sv=Fmt.splitVal(lines[i]);
      var cid=Fmt.digits(f[C.camp]||""),gid=C.goal>=0?Fmt.digits(f[C.goal]||""):"";
      var acc=Fmt.digits(f[C.acc]||"");
      var k=cid+"|"+gid, cur=live[k];
      var rec={cid:cid,gid:gid,name:f[C.campName],goal:C.goalName>=0?f[C.goalName]:"бюджет",want:sv.value,got:cur,acc:acc};
      byAcc[acc]=byAcc[acc]||{ok:0,bad:0,absent:0};
      if(cur===undefined){ absent.push(rec); byAcc[acc].absent++; }
      else if(Fmt.num(cur)===Fmt.num(sv.value)){ okRows.push(rec); byAcc[acc].ok++; }
      else { bad.push(rec); byAcc[acc].bad++; }
    }
    return {total:lines.length-1,ok:okRows.length,bad:bad,absent:absent,byAcc:byAcc};
  }
  return {compare:compare};
})();

/* работает и в браузере, и в Node — ядро не зависит от DOM */
if (typeof module !== "undefined" && module.exports) module.exports = Verify;

/* ---------- src/xlsx/reader.js ---------- */
/* ══════════════════════════════════════════════════════════════════════════
   МОДУЛЬ 2 · Xlsx — чтение xlsx без библиотек (zip + xml)
   ══════════════════════════════════════════════════════════════════════════ */
var Xlsx=(function(){
  function colToIdx(l){var n=0;for(var i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return n-1;}
  function colLetter(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
  async function unzip(buf){
    var dv=new DataView(buf),u8=new Uint8Array(buf),eo=-1;
    for(var i=buf.byteLength-22;i>=0;i--)if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
    if(eo<0)throw new Error("файл не похож на xlsx");
    var cnt=dv.getUint16(eo+10,true),off=dv.getUint32(eo+16,true),files={};
    for(var n=0;n<cnt;n++){
      if(dv.getUint32(off,true)!==0x02014b50)throw new Error("повреждённый архив");
      var m=dv.getUint16(off+10,true),cs=dv.getUint32(off+20,true);
      var fn=dv.getUint16(off+28,true),ex=dv.getUint16(off+30,true),cm=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
      var name=new TextDecoder().decode(u8.subarray(off+46,off+46+fn));
      var lfn=dv.getUint16(lho+26,true),lex=dv.getUint16(lho+28,true),st=lho+30+lfn+lex;
      files[name]={m:m,d:u8.subarray(st,st+cs)}; off+=46+fn+ex+cm;
    }
    return {get:async function(n){
      var f=files[n]; if(!f)return null;
      if(f.m===0)return f.d.slice();
      var ds=new DecompressionStream("deflate-raw");
      return new Uint8Array(await new Response(new Blob([f.d]).stream().pipeThrough(ds)).arrayBuffer());
    }};
  }
  function grid(doc,sst){
    var rows=doc.getElementsByTagName("row"),tmp=[],maxC=0;
    for(var i=0;i<rows.length;i++){
      var row=rows[i],ri=parseInt(row.getAttribute("r"),10)-1; if(isNaN(ri))ri=i;
      var cs=row.getElementsByTagName("c"),arr=[];
      for(var j=0;j<cs.length;j++){
        var c=cs[j],ref=(c.getAttribute("r")||"").replace(/[0-9]/g,""),col=ref?colToIdx(ref):j,t=c.getAttribute("t"),v="";
        if(t==="inlineStr"){var is=c.getElementsByTagName("t");v=is.length?is[0].textContent:"";}
        else{var vv=c.getElementsByTagName("v");if(vv.length){var raw=vv[0].textContent;v=(t==="s")?(sst[+raw]||""):Fmt.plain(raw);}}
        arr[col]=v; if(col+1>maxC)maxC=col+1;
      }
      tmp[ri]=arr;
    }
    var out=[];
    for(var k=0;k<tmp.length;k++){var a=tmp[k]||[],r=[];for(var c2=0;c2<maxC;c2++)r.push(a[c2]!==undefined?a[c2]:"");out.push(r);}
    return out;
  }
  /* Открывает книгу: разбирает только оглавление (быстро, даже для больших файлов).
     Листы читаются по требованию — иначе на отчёте с 25 листами интерфейс замирает. */
  async function open(buf){
    var zip=await unzip(buf),dec=new TextDecoder("utf-8");
    var P=function(t){return new DOMParser().parseFromString(t,"application/xml");};
    var wbx=P(dec.decode(await zip.get("xl/workbook.xml")));
    var rels=P(dec.decode(await zip.get("xl/_rels/workbook.xml.rels"))),map={},rl=rels.getElementsByTagName("Relationship");
    for(var k=0;k<rl.length;k++)map[rl[k].getAttribute("Id")]=rl[k].getAttribute("Target");
    var sh=wbx.getElementsByTagName("sheet"),list=[];
    for(var s=0;s<sh.length;s++){
      var el=sh[s],rid=el.getAttribute("r:id");
      if(!rid)for(var a=0;a<el.attributes.length;a++){var at=el.attributes[a];if(at.localName==="id"){rid=at.value;break;}}
      var tgt=map[rid]||"";
      list.push({name:el.getAttribute("name"),path:tgt.charAt(0)==="/"?tgt.slice(1):("xl/"+tgt),tgt:tgt});
    }
    var sst=null;
    async function strings(){
      if(sst)return sst;
      sst=[];
      var ss=await zip.get("xl/sharedStrings.xml");
      if(ss){
        var d=P(dec.decode(ss)),si=d.getElementsByTagName("si");
        for(var i=0;i<si.length;i++){
          var ts=si[i].getElementsByTagName("t"),str="";
          for(var j=0;j<ts.length;j++)str+=ts[j].textContent;
          sst.push(str);
        }
      }
      return sst;
    }
    return {
      sheets:list.map(function(x){return x.name;}),
      /* rows выбранного листа */
      sheet:async function(i){
        var it=list[i]; if(!it)return [];
        var tbl=await strings();
        var sb=await zip.get(it.path)||await zip.get("xl/"+it.tgt.replace(/^\//,""));
        return sb?grid(P(dec.decode(sb)),tbl):[];
      }
    };
  }
  /* Прочитать книгу целиком — используется в тестах ядра. */
  async function read(buf){
    var wb=await open(buf),out=[];
    for(var i=0;i<wb.sheets.length;i++)out.push({name:wb.sheets[i],rows:await wb.sheet(i)});
    return out;
  }
  return {open:open,read:read,colToIdx:colToIdx,colLetter:colLetter};
})();

function wireDrop(dropId,inputId,cb){

      if(e.ok&&e.mode===S.exp.mode){ e.name=f.name; S.spares.push(e); accLearn(Accounts.harvest(e)); }
      else { $("spareInfo").insertAdjacentHTML("beforeend",
        '<div class="box err small">'+esc(f.name)+' — не подходит: нужен заливочный того же типа ('+
        (S.exp.mode==="bids"?"ставки":"бюджеты")+').</div>'); }
      if(!--left){ renderSpares(); renderMiss(); ready(); }
    });
  });
});

/* ---------- шаг 2 ---------- */
wireDrop("dropSrc","fileSrc",function(files){ Array.prototype.forEach.call(files,loadSrc); });
/* ---------- загрузка мастер-файла ----------
   Большой xlsx (десятки листов) читается в два приёма: сначала только
   оглавление, потом — выбранные листы, с прогрессом и без подвисаний. */
var pane=function(){ return $("srcPane"); };
function paneShow(html){ pane().innerHTML=html; pane().classList.remove("hide"); }
function paneHide(){ pane().classList.add("hide"); pane().innerHTML=""; }
var breathe=function(){ return new Promise(function(r){ setTimeout(r,0); }); };

function loadSrc(file){
  var n=file.name.toLowerCase();
  if(n.endsWith(".csv")){
    paneShow('<div class="box info small">Читаю <b>'+esc(file.name)+'</b>…</div>');
    readText(file,function(t){ paneHide(); addSheet(file.name,file.name,Sheet.parseCsvGrid(t)); });
    return;
  }
  paneShow('<div class="box info small">Открываю <b>'+esc(file.name)+'</b>…</div>');
  var r=new FileReader();
  r.onerror=function(){ paneShow('<div class="box err small">Не удалось прочитать файл.</div>'); };
  r.onload=async function(){
    try{
      var wb=await Xlsx.open(r.result);
      pickSheets(file.name,wb);
    }catch(e){
      paneShow('<div class="box err small">Не удалось прочитать xlsx: '+esc(e.message)+
               '<br>Сохрани нужный лист как CSV и загрузи его.</div>');
    }
  };
  r.readAsArrayBuffer(file);
}

/* выбор листов */
function pickSheets(fileName,wb){
  var loaded={};
  S.sources.forEach(function(s){ if(s.file===fileName)loaded[s.name]=1; });
  var h='<div class="pick"><div class="ph"><b>'+esc(fileName)+'</b>'+
        '<span class="muted small">листов: '+wb.sheets.length+'</span></div>'+
        '<input type="text" id="pickFilter" placeholder="фильтр по названию листа" style="margin-bottom:8px">'+
        '<div class="plist" id="pickList">';
  wb.sheets.forEach(function(name,i){
    var was=loaded[name];
    h+='<label class="pitem'+(was?' used':'')+'" data-name="'+esc(name.toLowerCase())+'">'+
       '<input type="checkbox" value="'+i+'"'+(was?' disabled':'')+'> <span>'+esc(name)+
       (was?' <span class="muted small">— уже загружен</span>':'')+'</span></label>';
  });
  h+='</div><div class="pf"><button id="pickGo" class="btn mini" disabled>Загрузить</button>'+
     '<button id="pickCancel" class="btn sec mini">Отмена</button>'+
     '<span class="muted small" id="pickCount">ничего не выбрано</span></div></div>';
  paneShow(h);

  var list=$("pickList"), go=$("pickGo");
  function sync(){
    var n=list.querySelectorAll("input:checked").length;
    go.disabled=!n;
    $("pickCount").textContent=n?("выбрано: "+n):"ничего не выбрано";
  }
  list.addEventListener("change",sync);
  $("pickFilter").addEventListener("input",function(){
    var q=this.value.trim().toLowerCase();
    list.querySelectorAll(".pitem").forEach(function(el){
      el.classList.toggle("hide", q && el.dataset.name.indexOf(q)<0);
    });
  });
  $("pickCancel").addEventListener("click",paneHide);
  go.addEventListener("click",async function(){
    var picked=[].map.call(list.querySelectorAll("input:checked"),function(c){return {i:+c.value,name:wb.sheets[+c.value]};});
    for(var k=0;k<picked.length;k++){
      paneShow('<div class="box info small"><b>Читаю листы…</b> '+(k+1)+' из '+picked.length+
               ' · <span class="muted">'+esc(picked[k].name)+'</span>'+
               '<div class="bar"><i style="width:'+Math.round(k/picked.length*100)+'%"></i></div></div>');
      await breathe();
      try{
        var rows=await wb.sheet(picked[k].i);
        if(rows.length>1)addSheet(fileName,picked[k].name,rows);
      }catch(e){ /* пропускаем нечитаемый лист */ }
    }
    paneHide();
  });
}
function addSheet(file,name,rows){
  S.sources.push(Sheet.describe(file,name,rows));
  renderFiles();
  if(S.exp&&!S.rules.length)addRule();
  renderRules(); renderMiss(); ready();
}
function renderFiles(){
  $("files").innerHTML=S.sources.map(function(s,i){
    return '<div class="fitem"><span>📄 <b>'+esc(s.name)+'</b> <span class="muted">· '+Math.max(0,s.rows.length-s.headerRow-1)+' строк · '+esc(s.file)+'</span></span><button class="rmv" data-i="'+i+'">убрать ✕</button></div>';
  }).join("");
  $("files").querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){
    var i=+b.dataset.i; S.sources.splice(i,1);
    S.rules=S.rules.filter(function(r){return r.sheet!==i;}).map(function(r){ if(r.sheet>i)r.sheet--; return r; });
    renderFiles(); renderRules(); renderMiss(); ready();
  });});
}

/* ---------- шаг 3: правила ---------- */
$("addRule").addEventListener("click",function(){ addRule(); renderRules(); ready(); });
function addRule(){
  if(!S.exp||!S.sources.length)return;
  var si=Math.min(S.rules.length,S.sources.length-1);
  var r={name:S.sources[si].name,sheet:si,useScope:false,scopeIds:[],map:{}};
  clearRuleMap(r); S.rules.push(r);
}
/* Столбцы под значения не подбираются автоматически: кейсы каждый раз разные,
   и «умная» подстановка создаёт ложное доверие. Специалист выбирает сам. */
function clearRuleMap(r){ r.map={}; }
function colOptions(si,sel){
  var s=S.sources[si]; if(!s)return '<option value="-1">—</option>';
  var h=s.rows[s.headerRow]||[],cols=0; s.rows.forEach(function(r){if(r.length>cols)cols=r.length;});
  var o='<option value="-1">— не заливать —</option>';
  for(var i=0;i<cols;i++){
    var nm=(h[i]!==undefined&&String(h[i]).trim()!=="")?String(h[i]):("столбец "+Xlsx.colLetter(i));
    o+='<option value="'+i+'"'+(sel===i?' selected':'')+'>'+esc(nm)+'  ['+Xlsx.colLetter(i)+']</option>';
  }
  return o;
}
/* Сколько кампаний правила реально есть в заливочном — сразу видно,
   если перепутаны файлы, дата выгрузки или столбец ID. */
function ruleMatch(r){
  var sh=S.sources[r.sheet]; if(!sh||!S.exp)return null;
  var scope=null;
  if(r.useScope&&r.scopeIds.length){ scope={}; r.scopeIds.forEach(function(i){scope[i]=1;}); }
  var total=0,inExp=0,withVal=0,valIn=0;
  var cols=[]; for(var k in r.map){ if(r.map[k]>=0)cols.push(r.map[k]); }
  for(var i=sh.headerRow+1;i<sh.rows.length;i++){
    var row=sh.rows[i]; if(!row)continue;
    var cid=Fmt.digits(row[sh.idCol]||""); if(!cid)continue;
    if(scope&&!scope[cid])continue;
    total++;
    var has=cols.some(function(c){ var v=Fmt.num(row[c]); return v!==null&&v>0&&Fmt.roundHalfUp(v)>0; });
    if(has)withVal++;
    if(S.exp.campaigns[cid]){ inExp++; if(has)valIn++; }
  }
  return {total:total,inExp:inExp,withVal:withVal,valIn:valIn};
}
function addMissingOn(){ return !!S.addMissing; }
/* если лист правила не совпал — ищем среди загруженных тот, что совпадает лучше всех */
function bestSheet(exceptIdx){
  if(!S.exp)return null;
  var best=null;
  S.sources.forEach(function(sh,i){
    if(i===exceptIdx)return;
    var hit=0;
    for(var r=sh.headerRow+1;r<sh.rows.length;r++){
      var row=sh.rows[r]; if(!row)continue;
      var cid=Fmt.digits(row[sh.idCol]||"");
      if(cid&&S.exp.campaigns[cid])hit++;
    }
    if(hit>0&&(!best||hit>best.hit))best={name:sh.name,hit:hit,i:i};
  });
  return best;
}
function matchInfo(r){
  var m=ruleMatch(r);
  if(!m)return '<span class="muted small">—</span>';
  var chosen=Object.keys(r.map||{}).filter(function(k){return r.map[k]>=0;}).length;
  if(!chosen) return '<div class="box info small" style="margin:0">Выбери ниже столбец со значением — '+
    'после этого посчитаю, сколько кампаний правила есть в заливочном.</div>';
  var addable = S.exp && S.exp.mode==="budget";
  var cls = (m.withVal===0) ? "warn"
          : (m.valIn===m.withVal) ? "ok"
          : (addable ? (addMissingOn()?"ok":"warn") : (m.valIn===0?"err":"warn"));
  var txt='кампаний в правиле: <b>'+m.total+'</b> · со значением: <b>'+m.withVal+
          '</b> · <b>из них есть в заливочном: '+m.valIn+'</b>';
  var canAdd = S.exp && S.exp.mode==="budget";        // строки можно собрать заново только для бюджетов
  var absent = m.withVal-m.valIn;
  if(m.valIn===0){
    if(canAdd){
      txt+='<br>В заливочном этих кампаний нет — <b>'+m.withVal+'</b> строк будут собраны заново'+
           (addMissingOn()?'.':', если включить «Добавлять кампании, которых нет в заливочном» ниже.');
    }else{
      txt+='<br>Ни одна кампания со значением не найдена в заливочном.';
      var better=bestSheet(r.sheet);
      if(better) txt+=' <b>Похоже, нужен лист «'+esc(better.name)+'»</b> — его кампании есть в заливочном ('+better.hit+' шт.).';
      else txt+=' Проверь: тот ли заливочный (дата, аккаунты), тот ли лист и правильный ли столбец ID в «Настройках листов».';
    }
  }
  else if(absent>0){
    txt+='<br>'+absent+' кампаний нет в заливочном — '+
         (canAdd
           ? (addMissingOn()?'будут добавлены новыми строками.':'включи «Добавлять кампании…» ниже, иначе они не попадут в файл.')
           : 'для них значения не попадут в файл.');
  }
  return '<div class="box '+cls+' small" style="margin:0">'+txt+'</div>';
}

function renderRules(){
  var host=$("rules"); if(!S.exp){host.innerHTML="";return;}
  if(!S.sources.length){ host.innerHTML='<p class="muted small">Сначала загрузи мастер-файл (шаг 2).</p>'; return; }
  host.innerHTML=S.rules.map(function(r,ri){
    var keys=S.exp.mode==="bids"?S.exp.goals:[{id:"BUDGET",label:"Недельный бюджет"}];
    var h='<div class="rule"><div class="rh"><b>Правило '+(ri+1)+'</b>'+
      '<button class="rmv" data-rm="'+ri+'">удалить ✕</button></div>';
    h+='<table class="t"><tr><th style="width:26%">Лист</th><td><select data-sheet="'+ri+'">'+
      S.sources.map(function(s,i){return '<option value="'+i+'"'+(i===r.sheet?' selected':'')+'>'+esc(s.name)+'</option>';}).join("")+
      '</select></td></tr>'+
      '<tr><th>Охват</th><td><label class="opt small" style="padding:2px 0"><input type="radio" name="sc'+ri+'" data-scope="'+ri+'" value="all"'+(r.useScope?'':' checked')+'> все РК из листа</label>'+
      '<label class="opt small" style="padding:2px 0"><input type="radio" name="sc'+ri+'" data-scope="'+ri+'" value="ids"'+(r.useScope?' checked':'')+'> только по списку ID</label>'+
      '<textarea data-ids="'+ri+'" class="'+(r.useScope?'':'hide')+'" placeholder="вставь столбец ID из Excel">'+esc(r.scopeIds.join("\n"))+'</textarea>'+
      '<div class="small muted" data-idsinfo="'+ri+'"></div></td></tr>'+
      '<tr><th>Совпадение</th><td>'+matchInfo(r)+'</td></tr></table>';
    h+='<table class="t" style="margin-top:6px"><tr><th style="width:40%">'+(S.exp.mode==="bids"?"Цель в заливочном":"Значение")+'</th><th>Столбец листа</th></tr>';
    keys.forEach(function(g){
      h+='<tr><td class="k">'+esc(g.label)+'</td><td><select data-col="'+ri+'|'+g.id+'">'+colOptions(r.sheet,r.map[g.id]!==undefined?r.map[g.id]:-1)+'</select></td></tr>';
    });
    h+='</table></div>';
    return h;
  }).join("");

  host.querySelectorAll("[data-rm]").forEach(function(b){b.addEventListener("click",function(){
    S.rules.splice(+b.dataset.rm,1); renderRules(); renderMiss(); ready(); });});
  host.querySelectorAll("[data-sheet]").forEach(function(s){s.addEventListener("change",function(){
    var r=S.rules[+s.dataset.sheet]; r.sheet=+s.value; r.name=S.sources[r.sheet].name; clearRuleMap(r);
    renderRules(); renderMiss(); ready(); });});
  host.querySelectorAll("[data-scope]").forEach(function(el){el.addEventListener("change",function(){
    var r=S.rules[+el.dataset.scope]; r.useScope=(el.value==="ids");
    host.querySelector('[data-ids="'+el.dataset.scope+'"]').classList.toggle("hide",!r.useScope);
    renderMiss(); ready(); });});
  host.querySelectorAll("[data-ids]").forEach(function(t){t.addEventListener("input",function(){
    var ri=+t.dataset.ids,r=S.rules[ri]; r.scopeIds=Sheet.parseIdList(t.value);
    var inExp=r.scopeIds.filter(function(i){return S.exp.campaigns[i];}).length;
    host.querySelector('[data-idsinfo="'+ri+'"]').innerHTML=r.scopeIds.length?
      ('ID: <b>'+r.scopeIds.length+'</b> · есть в заливочном: <b>'+inExp+'</b> · нет: <b>'+(r.scopeIds.length-inExp)+'</b>'):'';
    renderMiss(); ready(); });});
  host.querySelectorAll("[data-col]").forEach(function(s){s.addEventListener("change",function(){
    var p=s.dataset.col.split("|"),r=S.rules[+p[0]],v=+s.value;
    if(v<0)delete r.map[p[1]]; else r.map[p[1]]=v;
    renderRules(); renderMiss(); ready(); });});
  // проставить info по ID
  S.rules.forEach(function(r,ri){
    var el=host.querySelector('[data-idsinfo="'+ri+'"]'); if(!el||!r.scopeIds.length)return;
    var inExp=r.scopeIds.filter(function(i){return S.exp.campaigns[i];}).length;
    el.innerHTML='ID: <b>'+r.scopeIds.length+'</b> · есть в заливочном: <b>'+inExp+'</b> · нет: <b>'+(r.scopeIds.length-inExp)+'</b>';
  });
}

/* ---------- шаг 4 ---------- */
document.querySelectorAll('input[name=scn]').forEach(function(r){r.addEventListener("change",function(){
  S.scenario=r.value;
  document.querySelectorAll('#tab-build .radio').forEach(function(l){l.classList.toggle("on",l.querySelector("input").checked);});
  $("newOpts").classList.toggle("hide",S.scenario!=="new"); renderMiss(); ready(); });});
["roundNew","roundAll","onlyChanged"].forEach(function(id){$(id).addEventListener("change",function(){renderMiss();ready();});});

function plan(){
  return {exp:S.exp,sources:S.sources,rules:S.rules,scenario:S.scenario,
    spares:S.spares,accountBook:accLoad(),
    onlyChanged:$("onlyChanged").checked,roundNew:$("roundNew").checked,roundAll:$("roundAll").checked,
    addMissing:!!S.addMissing};
}
function renderMiss(){
  var el=$("missBlock"); if(!S.exp||!S.rules.length){el.innerHTML="";return;}
  var R=Rules.resolve(S.exp,S.sources,S.rules,{roundNew:$("roundNew").checked});
  var missing=R.campaigns.filter(function(c){return !S.exp.campaigns[c]&&Object.keys(R.lut).some(function(k){return k.indexOf(c+"|")===0;});});
  if(!missing.length){ el.innerHTML=''; return; }
  if(S.exp.mode==="bids"){
    el.innerHTML='<div class="box err small" style="margin-top:12px"><b>'+missing.length+' кампаний нет в заливочном.</b> Для ставок строки им не создаются — цели кампании неизвестны, Оригами отбил бы весь файл. После сборки покажу список: их нужно добрать перевыгрузкой.</div>';
    return;
  }
  var h='<hr class="sep"><label class="opt"><input type="checkbox" id="addMissing"'+(S.addMissing?' checked':'')+'><span><b>Добавлять кампании, которых нет в заливочном</b><span class="t2">'+missing.length+' РК. Их настоящие строки возьмутся из запасных выгрузок. Ничего не выдумывается: чего нет ни в одной выгрузке — уйдёт в список на ручную работу.</span></span></label><div id="missCfg"></div>';
  el.innerHTML=h;
  $("addMissing").addEventListener("change",function(){ S.addMissing=this.checked; renderMissCfg(missing,R); renderRules(); ready(); });
  renderMissCfg(missing,R);
}
function renderMissCfg(missing,R){
  var box=$("missCfg"); if(!box)return;
  if(!S.addMissing){ box.innerHTML=""; return; }
  /* Строку берём только из настоящей выгрузки. Считаем, для скольких
     кампаний она найдётся в запасных, а для скольких — нет. */
  var have=[],lack=[],accs={};
  missing.forEach(function(cid){
    var found=S.spares.some(function(sp){
      return sp.mode===S.exp.mode&&sp.rows.some(function(r){return r.cid===cid;});});
    (found?have:lack).push(cid);
    var lg=(R.meta[cid]||{}).login||""; if(lg&&!found)accs[lg]=(accs[lg]||0)+1;
  });
  var h="";
  if(have.length)h+='<div class="box ok small">Строки найдутся в запасных выгрузках: <b>'+have.length+
    '</b> РК. Аккаунт, размещение и стратегия у них настоящие.</div>';
  if(lack.length){
    h+='<div class="box err small"><b>Не собрать: '+lack.length+' РК.</b> Их нет ни в основной выгрузке, '+
       'ни в запасных. Аккаунт, размещение и стратегию из мастер-файла не вывести, а угаданную строку '+
       'Оригами отобьёт вместе со всем файлом — поэтому такие РК уходят в список на ручную работу.</div>';
    var lg=Object.keys(accs);
    if(lg.length)h+='<div class="small muted" style="margin-top:6px">Перевыгрузить заливочный по аккаунтам:</div><table class="t">'+
      lg.map(function(x){ var f=Accounts.find(x,S.exp,accLoad());
        return '<tr><td class="k">'+esc(x)+' <span class="muted small">· '+accs[x]+' РК</span></td>'+
               '<td style="width:34%">'+(f?'AccountID <b>'+esc(f.id)+'</b> <span class="muted small">'+esc(f.note)+'</span>':
               '<span class="muted small">AccountID неизвестен</span>')+'</td></tr>';}).join("")+'</table>';
  }
  box.innerHTML=h;
}

/* ---------- шаг 5 ---------- */
function ready(){
  var ok=S.exp&&S.rules.length&&S.rules.some(function(r){return Object.keys(r.map).length>0;});
  $("go").disabled=!ok; $("dl").classList.add("hide"); $("dlRep").classList.add("hide");
  $("dlMan").classList.add("hide"); $("status").textContent="";
}
$("go").addEventListener("click",function(){
  var p=plan(),res=Build.run(p);
  var audit=Audit.check(res.text,S.exp,res.lut,p);
  S.result=res; S.audit=audit;
  var st=res.stats,bids=S.exp.mode==="bids",fail=audit.filter(function(a){return !a.ok&&a.lvl==="f";}).length;

  var h='<div class="stats">'+
    '<div class="stat"><div class="n">'+st.rowsOut+'</div><div class="l">строк в файле</div></div>'+
    '<div class="stat"><div class="n">'+st.campaigns+'</div><div class="l">кампаний</div></div>'+
    '<div class="stat"><div class="n">'+st.inserted+'</div><div class="l">значений подставлено</div></div>'+
    '<div class="stat"><div class="n">'+st.changed+'</div><div class="l">реально изменилось</div></div>'+
    (st.constructed?'<div class="stat"><div class="n">'+st.constructed+'</div><div class="l">строк добавлено</div></div>':'')+
    (st.rounded?'<div class="stat"><div class="n">'+st.rounded+'</div><div class="l">округлено прочих</div></div>':'')+'</div>';

  h+='<div class="box '+(fail?'err':'ok')+'" style="margin-top:12px"><b>Пред-полётная проверка: '+
     (fail?('провалено пунктов — '+fail+'. Файл лучше не заливать.'):'все пункты пройдены — файл безопасен для заливки')+'</b></div>';
  h+='<div style="margin-top:6px">'+audit.map(function(a){

function download(text,name){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

/* Что заливочным не решается: строки, которых в нём нет, цели, которых нет
   у кампании, и значения, округляющиеся в ноль. Такое ставят руками, поэтому
   отдаём отдельным CSV — иначе список приходится выписывать вручную. */
$("dlMan").addEventListener("click",function(){
  var m=S.result&&S.result.manual; if(!m||!m.length)return;
  var CR=String.fromCharCode(13),LF=String.fromCharCode(10);
  var CRLF=CR+LF,BOM=String.fromCharCode(0xFEFF);
  var risky=new RegExp('["' + ";" + CR + LF + ']');
  var q=function(v){ v=String(v==null?"":v);
    return risky.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var L=["Id кампании;Логин;Название кампании;Что ставить;Значение;Почему не в файле"];
  m.forEach(function(x){
    L.push([x.cid,x.login,x.name,x.target,x.value,x.reason].map(q).join(";")); });
  download(BOM+L.join(CRLF)+CRLF,S.fileName.replace(/[.]csv$/,"")+"_НА-РУКИ.csv");
});

/* ══════════════════════════════════════════════════════════════════════════
   Набор проверок ядра — все кейсы из реальной практики.

   Запускается в двух средах:
     • Node   — tests/core.test.js (без xlsx: нужен браузерный API)
     • браузер — кнопка «самопроверка» в подвале приложения (полный набор)
   ══════════════════════════════════════════════════════════════════════════ */
(function (root, factory) {

  var EXPT=BOM+HDR+"\r\n"+
    row("900101","acc-media","800000001","camp_a","Поиск","Оптимизация конверсий, множественные цели","357428649","B2B заказ (полный доход)","227")+"\r\n"+

    if (!value) { input.focus(); return; }
    btn.disabled = true;
    var digest = await sha256(value);
    btn.disabled = false;
    if (digest === HASH) {
      try { localStorage.setItem(KEY, HASH); } catch (e) {}
      reveal();
      return;
    }
    err.textContent = "Неверный пароль";
    err.classList.remove("hide");
    input.select();
  }

  btn.addEventListener("click", submit);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  input.addEventListener("input", function () { err.classList.add("hide"); });

  /* доступно тестам */
  if (typeof module !== "undefined" && module.exports) module.exports = { sha256Local: sha256Local };
})();
</script>
